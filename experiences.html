<body class="bg-surface text-on-surface">
  <div id="navbar-container"></div>

  <header class="relative pb-md pt-[120px] px-md overflow-hidden bg-background">

      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Curated outings tailored to your special occasion.</p>
    </div>
  </header>

  <main class="max-w-container-max mx-auto px-md pb-xl pt-lg">
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-md max-w-5xl mx-auto">
      <a href="/birthday" class="group cursor-pointer bg-white p-6 rounded-2xl shadow-sm border border-outline-variant hover:border-secondary hover:shadow-md transition-all text-center flex flex-col items-center justify-center min-h-[140px]">
        <span class="material-symbols-outlined text-secondary text-4xl mb-3 group-hover:scale-110 transition-transform">cake</span>
        <p class="font-label-md text-sm">Birthday</p>
      </a>
      <a href="/bachelor-bachelorette" class="group cursor-pointer bg-white p-6 rounded-2xl shadow-sm border border-outline-variant hover:border-secondary hover:shadow-md transition-all text-center flex flex-col items-center justify-center min-h-[140px]">
        <span class="material-symbols-outlined text-secondary text-4xl mb-3 group-hover:scale-110 transition-transform">celebration</span>
        <p class="font-label-md text-sm">Bachelor/ette</p>
      </a>
      <a href="/family-day" class="group cursor-pointer bg-white p-6 rounded-2xl shadow-sm border border-outline-variant hover:border-secondary hover:shadow-md transition-all text-center flex flex-col items-center justify-center min-h-[140px]">
        <span class="material-symbols-outlined text-secondary text-4xl mb-3 group-hover:scale-110 transition-transform">family_restroom</span>
        <p class="font-label-md text-sm">Family Day</p>
      </a>
      <a href="/luxury-yachts" class="group cursor-pointer bg-white p-6 rounded-2xl shadow-sm border border-outline-variant hover:border-secondary hover:shadow-md transition-all text-center flex flex-col items-center justify-center min-h-[140px]">
        <span class="material-symbols-outlined text-secondary text-4xl mb-3 group-hover:scale-110 transition-transform">diamond</span>
        <p class="font-label-md text-sm">Luxury Yachts</p>
      </a>
      <a href="/corporate" class="group cursor-pointer bg-white p-6 rounded-2xl shadow-sm border border-outline-variant hover:border-secondary hover:shadow-md transition-all text-center flex flex-col items-center justify-center min-h-[140px]">
        <span class="material-symbols-outlined text-secondary text-4xl mb-3 group-hover:scale-110 transition-transform">business_center</span>
        <p class="font-label-md text-sm">Corporate</p>
      </a>

        <span class="material-symbols-outlined text-secondary text-4xl mb-3 group-hover:scale-110 transition-transform">wb_twilight</span>
        <p class="font-label-md text-sm">Sunset Cruise</p>
