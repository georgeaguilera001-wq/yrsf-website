<!DOCTYPE html>
<html class="light fouc-guard" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | YRSF</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="manifest" href="/admin/manifest.json"/>
  <meta name="theme-color" content="#455f88"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="YRSF Admin"/>
  <link rel="apple-touch-icon" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon-precomposed" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon" sizes="180x180" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon" sizes="152x152" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon" sizes="120x120" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="icon" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3" type="image/png"/>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).then(reg => {
        reg.update();
      }).catch(e => console.warn('SW reg failed:', e));
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
  <link rel="stylesheet" href="/css/tailwind.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/shared.css"/>
  <script>document.documentElement.classList.replace('fouc-guard','fouc-ready');</script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center px-md">
  <div class="w-full max-w-md">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg relative">
      <div class="absolute top-4 right-4 hidden lg:block" id="install-pwa-wrapper">
        <button id="install-pwa-btn" onclick="window.triggerPWAInstall()" class="bg-secondary text-on-secondary px-3 py-1 rounded-lg text-xs font-bold hover:bg-opacity-90 transition-all flex items-center gap-1 shadow-sm border border-secondary/20">
          <span class="material-symbols-outlined text-[16px]">install_desktop</span>
          <span>Install App</span>
        </button>
      </div>
      <script>
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
        });
        window.addEventListener('appinstalled', () => {
          const wrapper = document.getElementById('install-pwa-wrapper');
          if (wrapper) wrapper.style.display = 'none';
        });
        window.addEventListener('DOMContentLoaded', () => {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
          const wrapper = document.getElementById('install-pwa-wrapper');
          if (wrapper && isStandalone) {
            wrapper.style.display = 'none';
          }
        });
        window.triggerPWAInstall = async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') deferredPrompt = null;
          } else {
            alert("?? To install YRSF Admin on Microsoft Edge or Chrome:\n\n1. Look at the right side of your top URL/Address bar.\n2. Click the small computer/square icon [+] labeled 'App available'\n3. Click 'Install'!\n\n(If hidden: Click the 3 dots (...) menu in the top right of Edge/Chrome ? Apps ? Install YRSF Admin Portal)");
          }
        };
      </script>
      <div class="flex flex-col items-center justify-center text-center mb-lg">
        <img src="/img/logo-wide.png" alt="Yacht Rentals of South Florida" class="h-12 sm:h-14 w-auto object-contain mb-2"/>
        <p class="font-body text-body-md font-medium text-on-surface-variant">Admin Portal</p>
      </div>

      <!-- Error Message -->
      <div class="hidden bg-error-container text-on-error-container px-4 py-3 rounded-lg mb-md flex items-center gap-2" id="login-error">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span id="login-error-text"></span>
      </div>

      <form id="login-form" class="flex flex-col gap-md">
        <div>
          <label class="block font-label text-label-md text-on-surface-variant mb-2" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            class="w-full px-4 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest font-body text-body-md focus:ring-secondary focus:border-secondary transition-all"
            placeholder="admin@yrsf.com"
          />
        </div>
        <div>
          <label class="block font-label text-label-md text-on-surface-variant mb-2" for="password">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              class="w-full px-4 py-3 pr-12 border border-outline-variant rounded-lg bg-surface-container-lowest font-body text-body-md focus:ring-secondary focus:border-secondary transition-all"
              placeholder="????????"
            />
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" id="toggle-password" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>
        <button
          type="submit"
          id="login-btn"
          class="w-full bg-secondary text-on-secondary py-3 rounded-lg font-label text-label-md hover:opacity-90 transition-all flex items-center justify-center gap-2"
        >
          <span id="login-btn-text">Sign In</span>
          <span class="admin-spinner hidden" id="login-spinner"></span>
        </button>
      </form>

      <p class="text-center mt-md text-on-surface-variant font-body text-body-md">
        <a href="/" class="text-secondary hover:opacity-80 transition-colors">&larr; Back to Website</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/pages/admin-login.js"></script>
</body>
</html>
