<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password | YRSF</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="manifest" href="/admin/manifest.json"/>
  <meta name="theme-color" content="#455f88"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="YRSF Admin"/>
  <link rel="apple-touch-icon" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon-precomposed" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon" sizes="180x180" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon" sizes="152x152" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="apple-touch-icon" sizes="120x120" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3"/>
  <link rel="icon" href="https://yachtrentalsofsouthflorida.com/admin/logo.png?v=3" type="image/png"/>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).then(reg => {
        reg.update();
      }).catch(e => console.warn('SW reg failed:', e));
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload" href="/css/tailwind.css" as="style"/>
  <link rel="stylesheet" href="/css/tailwind.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/shared.css"/>

  <!-- Critical Anti-FOUC & Premium Splash Screen Styles (Inlined for instant paint before external CSS) -->
  <style id="yrsf-preloader-styles">
    #admin-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 38%, #162a45 0%, #0b1422 100%);
      z-index: 9999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      pointer-events: all;
      box-sizing: border-box;
      margin: 0;
      padding: 24px;
    }
    #admin-preloader.preloader-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    .yrsf-preloader-brand {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      text-align: center;
    }
    .yrsf-preloader-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(56, 189, 248, 0) 70%);
      animation: yrsf-glow-pulse 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .yrsf-preloader-logo {
      height: 52px;
      max-width: 280px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.6));
      position: relative;
      z-index: 2;
    }
    .yrsf-preloader-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 4px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #93c5fd;
      position: relative;
      z-index: 2;
    }
    .yrsf-preloader-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: yrsf-dot-pulse 1.5s ease-in-out infinite;
    }
    .yrsf-preloader-spinner-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .yrsf-preloader-spinner-track {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.08);
    }
    .yrsf-preloader-spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #38bdf8;
      border-right-color: #60a5fa;
      animation: yrsf-spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .yrsf-preloader-caption {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: #94a3b8;
      animation: yrsf-caption-fade 1.8s ease-in-out infinite;
    }
    @keyframes yrsf-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes yrsf-glow-pulse {
      0%, 100% { transform: scale(0.88); opacity: 0.35; }
      50% { transform: scale(1.2); opacity: 0.85; }
    }
    @keyframes yrsf-dot-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes yrsf-caption-fade {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
  <script>
    window.hideAdminLoader = function() {
      const p = document.getElementById('admin-preloader');
      if (p && !p.classList.contains('preloader-hidden')) {
        p.classList.add('preloader-hidden');
        setTimeout(() => {
          try { p.remove(); } catch(e) {}
        }, 500);
      }
    };
    // Fallback timer: ensure loader disappears after at most 2.5 seconds if not redirecting
    setTimeout(() => {
      if (typeof window.hideAdminLoader === 'function' && !window._isRedirecting) window.hideAdminLoader();
    }, 2500);
  </script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center px-md">
  <!-- YRSF Luxury Admin Loading Screen (Instant Anti-FOUC Cover) -->
  <div id="admin-preloader" aria-label="Loading Admin Portal">
    <div class="yrsf-preloader-brand">
      <div class="yrsf-preloader-glow"></div>
      <img src="/img/logo-wide.png" alt="Yacht Rentals of South Florida" class="yrsf-preloader-logo" onerror="this.style.display='none'; document.getElementById('yrsf-preloader-fallback-text').style.display='block';"/>
      <div id="yrsf-preloader-fallback-text" style="display:none; font-size: 22px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff;">YRSF</div>
      <div class="yrsf-preloader-badge">
        <span class="yrsf-preloader-badge-dot"></span>
        <span>Admin Portal</span>
      </div>
    </div>
    <div class="yrsf-preloader-spinner-wrapper">
      <div class="yrsf-preloader-spinner-track"></div>
      <div class="yrsf-preloader-spinner"></div>
    </div>
    <div class="yrsf-preloader-caption">Loading portal experience...</div>
  </div>
  <div class="w-full max-w-md">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg relative">
      <div class="absolute top-4 right-4 hidden lg:block" id="install-pwa-wrapper">
        <button id="install-pwa-btn" onclick="window.triggerPWAInstall()" class="bg-secondary text-on-secondary px-3 py-1 rounded-lg text-xs font-bold hover:bg-opacity-90 transition-all flex items-center gap-1 shadow-sm border border-secondary/20">
          <span class="material-symbols-outlined text-[16px]">install_desktop</span>
          <span>Install App</span>
        </button>
      </div>
      <script>
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
        });
        window.addEventListener('appinstalled', () => {
          const wrapper = document.getElementById('install-pwa-wrapper');
          if (wrapper) wrapper.style.display = 'none';
        });
        window.addEventListener('DOMContentLoaded', () => {
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
          const wrapper = document.getElementById('install-pwa-wrapper');
          if (wrapper && isStandalone) {
            wrapper.style.display = 'none';
          }
        });
        window.triggerPWAInstall = async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') deferredPrompt = null;
          } else {
            alert("?? To install YRSF Admin on Microsoft Edge or Chrome:\n\n1. Look at the right side of your top URL/Address bar.\n2. Click the small computer/square icon [+] labeled 'App available'\n3. Click 'Install'!\n\n(If hidden: Click the 3 dots (...) menu in the top right of Edge/Chrome ? Apps ? Install YRSF Setup Your Password)");
          }
        };
      </script>
      <div class="flex flex-col items-center justify-center text-center mb-lg">
        <img src="/img/logo-wide.png" alt="Yacht Rentals of South Florida" class="h-12 sm:h-14 w-auto object-contain mb-2"/>
        <p class="font-body text-body-md font-medium text-on-surface-variant">Setup Your Password</p>
      </div>

      <!-- Error Message -->
      <div class="hidden bg-error-container text-on-error-container px-4 py-3 rounded-lg mb-md flex items-center gap-2" id="login-error">
        <span class="material-symbols-outlined text-[18px]">error</span>
        <span id="login-error-text"></span>
      </div>

      <form id="login-form" class="flex flex-col gap-md">

        <div><label class="block font-label text-label-md text-on-surface-variant mb-2" for="password">New Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="new-password"
              class="w-full px-4 py-3 pr-12 border border-outline-variant rounded-lg bg-surface-container-lowest font-body text-body-md focus:ring-secondary focus:border-secondary transition-all"
              placeholder="        "
            />
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" id="toggle-password" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block font-label text-label-md text-on-surface-variant mb-2" for="confirm_password">Confirm Password</label>
          <div class="relative">
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
              autocomplete="new-password"
              class="w-full px-4 py-3 pr-12 border border-outline-variant rounded-lg bg-surface-container-lowest font-body text-body-md focus:ring-secondary focus:border-secondary transition-all"
              placeholder="        "
            />
          </div>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="w-full bg-secondary text-on-secondary py-3 rounded-lg font-label text-label-md hover:opacity-90 transition-all flex items-center justify-center gap-2"
        >
          <span id="login-btn-text">Save Password</span>
          <span class="admin-spinner hidden" id="login-spinner"></span>
        </button>
        <button
          type="button"
          id="logout-btn"
          class="w-full bg-surface-variant text-on-surface-variant py-3 rounded-lg font-label text-label-md hover:bg-surface-container-highest transition-all flex items-center justify-center gap-2 mt-2"
        >
          <span class="material-symbols-outlined text-[18px]">logout</span>
          <span>Logout</span></button></form>

      <p class="text-center mt-md text-on-surface-variant font-body text-body-md">
        <a href="/" class="text-secondary hover:opacity-80 transition-colors">&larr; Back to Website</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/pages/admin-change-password.js"></script>
</body>
</html>
