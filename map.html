<body class="bg-surface text-on-surface">
  <div id="navbar-container"></div>

  <header class="relative pb-md pt-[120px] px-md overflow-hidden bg-background">
    <div class="max-w-container-max mx-auto text-center relative z-10">
      <h1 class="font-display-lg text-headline-lg text-secondary mb-2">Our Departure Marinas</h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Wherever you are in Miami, we have a convenient dock nearby. Explore our primary departure zones.</p>
    </div>
  </header>

  <main class="max-w-container-max mx-auto px-md pb-xl">
    <section class="py-lg bg-surface">
      <div class="max-w-4xl mx-auto bg-surface-container-low p-5 rounded-2xl border border-outline-variant shadow-md text-left mb-6">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pb-4 border-b border-outline-variant">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined">my_location</span>
            </div>
            <div>
              <h4 class="font-bold text-on-surface text-base" style="margin:0;">Find Marinas &amp; Yachts Near You</h4>
              <p class="text-xs text-on-surface-variant" style="margin:0;">Calculate exact distances in miles from your hotel, rental, or current location.</p>
            </div>
          </div>
          <button id="locate-me-btn" class="bg-secondary text-on-secondary px-5 py-2.5 rounded-lg font-label-md text-sm font-bold shadow hover:opacity-90 transition-all flex items-center gap-2 shrink-0 w-full md:w-auto justify-center">
            <span class="material-symbols-outlined text-base">near_me</span> Use My Current Location
          </button>
        </div>
      
        <div class="pt-4 flex flex-col sm:flex-row items-center gap-3 relative">
          <div class="flex items-center gap-2 text-xs font-bold text-secondary shrink-0">
            <span class="material-symbols-outlined text-base">hotel</span>
            <span>Not in Miami yet?</span>
          </div>
          <div class="relative flex-1 w-full">
            <input type="text" id="custom-stay-input" autocomplete="off" placeholder="Type where you will be staying (e.g., Fontainebleau, South Beach, Brickell)..." class="w-full px-4 py-2.5 bg-white border border-outline-variant rounded-lg font-body text-sm focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary pr-10 shadow-inner"/>
            <span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant text-lg pointer-events-none">search</span>
            <div id="custom-stay-dropdown" class="absolute left-0 right-0 top-full mt-1 bg-white border border-outline-variant rounded-lg shadow-xl max-h-60 overflow-y-auto z-50 hidden text-left"></div>
          </div>
        </div>
      </div>
      
      <div class="rounded-2xl overflow-hidden shadow-lg border border-outline-variant h-[500px] lg:h-[700px] relative z-10 w-full md:w-[80%] mx-auto">
        <div id="marina-map" class="w-full h-full"></div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <script type="module" src="/js/pages/map-page.js"></script>
</body>
